name: Bug report
description: Report a generation bug or profile behavior issue.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Device / iOS / context
      description: Include iPhone model, iOS version, and carrier if relevant.
